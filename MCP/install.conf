#
# Provide your home directory, the mcp/config and mcp/data folders will be created there
#
home_directory=/home/centos

#
# Provide the Localyzer MCP version (image tag)
#
mcp_image_version=1.0.1

#
# Provide the port the MCP server listens on, on this host. It is only
# reachable from this host (127.0.0.1): Apache proxies /mcp-key and /mcp to it.
#
serverPort=8088

#
# Provide the public host name AI clients use, e.g. mcp.yourcompany.com
#
public_host=mcp.lingoport.io

#
# Provide the Command Center URL, including /command-center
# e.g. https://yourserver/command-center
#
cc_url=https://olibouban.lingoport.io/command-center

#
# Which ways AI clients can sign in:
#   token        clients send their own Command Center username and token (/mcp-key)
#   oauth        clients sign in through an OIDC provider such as Keycloak (/mcp)
#   oauth,token  both
#
auth_modes=oauth,token

#
# Token path: what Command Center needs from the client
#   legacy       username + token (today's Command Center)
#   auto         username + token, or token alone
#   token-only   token alone, once Command Center no longer needs a username
#
cc_auth_style=legacy


# OPTIONAL: Only when auth_modes includes oauth

#
# OIDC issuer URL, e.g. https://mcp.yourcompany.com/auth/realms/localyzer-mcp
#
oidc_issuer=https://mcp.lingoport.io/auth/realms/localyzer-mcp

#
# Only if the OIDC provider runs on this same host: its keys URL on loopback, e.g.
# http://127.0.0.1:8089/auth/realms/localyzer-mcp/protocol/openid-connect/certs
# (this also needs network_mode=host below)
#
oidc_jwks_url=http://127.0.0.1:8089/auth/realms/localyzer-mcp/protocol/openid-connect/certs

#
# Map OIDC client ids to org ids, in single quotes, e.g. '{"localyzer-mcp-client": "acme"}'
#
client_org_map='{"localyzer-mcp-client": "test-org"}'

#
# Org id for clients not in the map (demo only, leave empty in production)
#
default_org_id=test-org

#
# Key that encrypts the stored Command Center credentials. Generate one with
#   sudo docker exec localyzer-mcp token-store generate-key
#
token_store_master_key=

#
# bridge: the container has its own network (default)
# host:   the container shares this host's network, needed when the OIDC
#         provider only listens on this host's 127.0.0.1
#
network_mode=host


# DO NOT CHANGE THE STUFF BELOW

#
# Provide your Docker Hub username (the same account as the Command Center install).
# Leave empty to use an image built on this host with docker build.
#
docker_username=

#
# Provide your Docker Hub account token (the same token as the Command Center install).
# If empty, the install asks for it.
#
docker_account_token=

container_name=localyzer-mcp

docker_image=lingoport/localyzer-mcp
